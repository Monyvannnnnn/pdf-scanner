<ion-content class="ion-padding">
  <div class="ion-text-center" style="margin-top: 50px">
    <h3>Document Scanner & Uploader</h3>
    <p>Test on Web (File) or Mobile (Scanner)</p>

    <!-- Mobile Scanner Button -->
    <ion-button expand="block" (click)="startScan()">
      <ion-icon name="camera" slot="start"></ion-icon>
      Open Mobile Scanner
    </ion-button>

    <div style="margin: 30px 0; border-top: 1px solid #ccc; padding-top: 20px">
      <p><b>Or upload from PC:</b></p>

      <!-- Web File Picker -->
      <input
        type="file"
        accept="application/pdf,image/*"
        (change)="onFileSelected($event)"
      />
    </div>

    <!-- Upload Status / Path -->
    @if (filePath) {
      <p style="margin-top: 20px; color: green; word-break: break-all">
        File ready: {{ filePath }}
      </p>
    }
  </div>
</ion-content>
